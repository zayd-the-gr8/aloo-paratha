<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alo0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #202124; color: white; overflow: hidden; }
        

        .tab-bar { display: flex; align-items: flex-end; background: #2f3033; padding: 8px 8px 0 8px; gap: 4px; }
        .tab { 
            display: flex; align-items: center; background: #35363a; padding: 8px 16px; 
            border-radius: 8px 8px 0 0; min-width: 120px; max-width: 200px; 
            cursor: pointer; transition: all 0.2s ease; position: relative; animation: slideIn 0.2s ease;
        }
        .tab.active { background: #202124; }
        .tab .close-btn { margin-left: auto; cursor: pointer; opacity: 0.6; font-size: 12px; }
        .tab .close-btn:hover { opacity: 1; }
        .add-tab-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 4px 12px; margin-bottom: 4px; }

        /* Navigation Bar */
        .nav-bar { display: flex; background: #202124; padding: 8px; gap: 8px; align-items: center; border-bottom: 1px solid #3c4043; }
        .address-bar { flex: 1; padding: 6px 12px; border-radius: 20px; border: none; background: #2f3033; color: white; outline: none; }

        /* Viewport Container */
        .container { flex: 1; position: relative; background: white; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
        iframe.active { display: block; }

        /* Animations */
        @keyframes slideIn {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="tab-bar" id="tabBar">
        <button class="add-tab-btn" onclick="createNewTab()">+</button>
    </div>

    <div class="nav-bar">
        <input type="text" class="address-bar" id="addressBar" placeholder="Search Google or type a URL" onkeydown="handleSearch(event)">
    </div>

    <div class="container" id="iframeContainer"></div>

    <script>
        const PROXY_BACKEND = "https://your-scramjet-backend.com"; // Replace with your backend URL
        let tabCount = 0;
        let activeTabId = null;

        function createNewTab() {
            tabCount++;
            const tabId = `tab-${tabCount}`;

            // Create Tab Element
            const tab = document.createElement('div');
            tab.className = 'tab';
            tab.id = `nav-${tabId}`;
            tab.innerHTML = `<span>New Tab</span> <span class="close-btn" onclick="closeTab(event, '${tabId}')">✕</span>`;
            tab.onclick = () => switchTab(tabId);
            
            const addBtn = document.querySelector('.add-tab-btn');
            document.getElementById('tabBar').insertBefore(tab, addBtn);

            // Create Iframe Element
            const iframe = document.createElement('iframe');
            iframe.id = tabId;
            iframe.src = 'about:blank';
            document.getElementById('iframeContainer').appendChild(iframe);

            switchTab(tabId);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('iframe').forEach(i => i.classList.remove('active'));

            const targetTab = document.getElementById(`nav-${tabId}`);
            const targetIframe = document.getElementById(tabId);

            if (targetTab && targetIframe) {
                targetTab.classList.add('active');
                targetIframe.classList.add('active');
                activeTabId = tabId;
                
                // Sync address bar text
                const currentUrl = targetIframe.dataset.originalUrl || '';
                document.getElementById('addressBar').value = currentUrl;
            }
        }

        function closeTab(event, tabId) {
            event.stopPropagation();
            document.getElementById(`nav-${tabId}`).remove();
            document.getElementById(tabId).remove();

            if (activeTabId === tabId) {
                const remainingTabs = document.querySelectorAll('.tab');
                if (remainingTabs.length > 0) {
                    const nextTabId = remainingTabs[remainingTabs.length - 1].id.replace('nav-', '');
                    switchTab(nextTabId);
                }
            }
        }

        function handleSearch(event) {
            if (event.key === 'Enter' && activeTabId) {
                let input = document.getElementById('addressBar').value.trim();
                if (!input) return;

                // Simple URL formatting
                if (!input.startsWith('http://') && !input.startsWith('https://')) {
                    if (input.includes('.') && !input.includes(' ')) {
                        input = 'https://' + input;
                    } else {
                        input = 'https://google.com' + encodeURIComponent(input);
                    }
                }

                const iframe = document.getElementById(activeTabId);
                iframe.dataset.originalUrl = input;
                
                // Encode the URL using Scramjet's expected encoding logic (often XOR or Base64 depending on setup)
                // For this example, we assume standard encoding used by the backend config
                const encodedUrl = btoa(input); // Simplistic example; use your proxy's specific codec helper
                iframe.src = `${PROXY_BACKEND}${encodedUrl}`;
                
                // Update tab title dynamically (fallback since cross-origin frames restrict title access)
                document.getElementById(`nav-${activeTabId}`).querySelector('span').innerText = input.split('/') || input;
            }
        }

        // Initialize first tab
        createNewTab();
    </script>
</body>
</html>
