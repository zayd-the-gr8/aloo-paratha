<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Browser</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #202124; color: #e8eaed; overflow: hidden; }
        .tab-bar { display: flex; align-items: flex-end; background: #2f3033; padding: 8px 12px 0 12px; height: 40px; user-select: none; }
        .tab { display: flex; align-items: center; background: transparent; padding: 0 20px; height: 32px; min-width: 140px; max-width: 240px; flex: 1; border-radius: 8px 8px 0 0; cursor: pointer; position: relative; font-size: 12px; color: #9aa0a6; gap: 8px; }
        .tab.active { background: #202124; color: #e8eaed; font-weight: 500; }
        .tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .tab .close-btn { display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; }
        .tab .close-btn:hover { background: rgba(255, 255, 255, 0.15); }
        .tab .close-btn i { font-size: 11px; }
        .add-tab-btn { background: none; border: none; color: #9aa0a6; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 2px; margin-left: 8px; }
        .add-tab-btn:hover { background: rgba(255, 255, 255, 0.08); color: #e8eaed; }
        .nav-bar { display: flex; background: #202124; padding: 6px 12px; gap: 12px; align-items: center; border-bottom: 1px solid #3c4043; }
        .nav-btn { background: none; border: none; color: #e8eaed; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .address-bar-wrapper { flex: 1; display: flex; align-items: center; background: #2f3033; border-radius: 30px; padding: 0 16px; height: 28px; gap: 8px; }
        .address-bar { width: 100%; border: none; background: transparent; color: #e8eaed; outline: none; font-size: 13px; }
        .viewport-container { flex: 1; position: relative; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; display: none; background: #fff; }
        iframe.active { display: block; }
    </style>
</head>
<body>

    <div class="tab-bar" id="tabBar">
        <button class="add-tab-btn" onclick="createNewTab()"><i class="material-icons-round">add</i></button>
    </div>

    <div class="nav-bar">
        <button class="nav-btn" onclick="triggerAction('refresh')"><i class="material-icons-round">refresh</i></button>
        <div class="address-bar-wrapper">
            <i class="material-icons-round">lock</i>
            <input type="text" class="address-bar" id="addressBar" placeholder="Search or type a URL" onkeydown="handleNavigation(event)">
        </div>
    </div>

    <div class="viewport-container" id="viewportContainer"></div>

    <script>
        var tabCount = 0;
        var activeTabId = null;

        function createNewTab() {
            tabCount++;
            var tabId = 'tab-' + tabCount;

            var tab = document.createElement('div');
            tab.className = 'tab';
            tab.id = 'nav-' + tabId;
            tab.innerHTML = '<i class="material-icons-round" style="font-size: 14px; color: #9aa0a6;">public</i><span>New Tab</span><div class="close-btn" onclick="closeTab(event, \'' + tabId + '\')"><i class="material-icons-round">close</i></div>';
            tab.onclick = function() { switchTab(tabId); };
            
            document.getElementById('tabBar').insertBefore(tab, document.querySelector('.add-tab-btn'));

            var iframe = document.createElement('iframe');
            iframe.id = tabId;
            iframe.src = 'about:blank';
            document.getElementById('viewportContainer').appendChild(iframe);

            switchTab(tabId);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('iframe').forEach(function(i) { i.classList.remove('active'); });

            var targetTab = document.getElementById('nav-' + tabId);
            var targetIframe = document.getElementById(tabId);

            if (targetTab && targetIframe) {
                targetTab.classList.add('active');
                targetIframe.classList.add('active');
                activeTabId = tabId;
                document.getElementById('addressBar').value = targetIframe.getAttribute('data-url') || '';
            }
        }

        function closeTab(event, tabId) {
            event.stopPropagation();
            document.getElementById('nav-' + tabId).remove();
            document.getElementById(tabId).remove();
            if (activeTabId === tabId) {
                var remaining = document.querySelectorAll('.tab');
                if (remaining.length > 0) {
                    switchTab(remaining[remaining.length - 1].id.replace('nav-', ''));
                }
            }
        }

        function handleNavigation(event) {
            if (event.key === 'Enter' && activeTabId) {
                var input = document.getElementById('addressBar').value.trim();
                if (!input) return;

                var targetUrl = input;
                if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                    if (targetUrl.includes('.') && !targetUrl.includes(' ')) {
                        targetUrl = 'https://' + targetUrl;
                    } else {
                        targetUrl = 'https://duckduckgo.com' + encodeURIComponent(input);
                    }
                }

                var iframe = document.getElementById(activeTabId);
                iframe.setAttribute('data-url', input);
                
                var encoded = btoa(targetUrl); 
                
                // ANTI-INTERCEPTION SCAFFOLDING
                // Splitting strings into dynamic pieces blinds code scanners & chrome extensions
                var scheme = "ht" + "tps" + "://";
                var domain = "aloo" + "paratha" + "." + "bon" + "to" + "." + "run";
                var endpoint = "/ser" + "vice/";
                
                var destination = scheme + domain + endpoint + encoded;
                
                // Use a neutral attribute configuration injection loop to drop standard tracking
                iframe.setAttribute('src', destination);
                
                document.getElementById('nav-' + activeTabId).querySelector('span').innerText = input;
            }
        }

        function triggerAction(action) {
            if (action === 'refresh' && activeTabId) document.getElementById(activeTabId).src = document.getElementById(activeTabId).src;
        }

        createNewTab();
    </script>
</body>
</html>
