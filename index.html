<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Browser</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #202124; color: #e8eaed; overflow: hidden; }
        
        .tab-bar { display: flex; align-items: flex-end; background: #2f3033; padding: 8px 12px 0 12px; gap: 0px; height: 40px; user-select: none; }
        
        .tab { 
            display: flex; align-items: center; background: transparent; padding: 0 20px; 
            height: 32px; min-width: 140px; max-width: 240px; flex: 1;
            border-radius: 8px 8px 0 0; cursor: pointer; transition: background 0.15s ease, color 0.15s ease; 
            position: relative; font-size: 12px; color: #9aa0a6; gap: 8px;
            animation: tabSpawn 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab:hover { background: rgba(255, 255, 255, 0.05); color: #e8eaed; }
        .tab.active { background: #202124; color: #e8eaed; font-weight: 500; }
        
        .tab.active::before, .tab.active::after {
            content: ''; position: absolute; bottom: 0; width: 8px; height: 8px; background: #202124; pointer-events: none;
        }
        .tab.active::before { left: -8px; border-bottom-right-radius: 8px; box-shadow: 4px 4px 0 4px #202124; }
        .tab.active::after { right: -8px; border-bottom-left-radius: 8px; box-shadow: -4px 4px 0 4px #202124; }

        .tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .tab .close-btn { 
            display: flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; border-radius: 50%; transition: background 0.1s;
        }
        .tab .close-btn:hover { background: rgba(255, 255, 255, 0.15); }
        .tab .close-btn i { font-size: 11px; }

        .add-tab-btn { 
            background: none; border: none; color: #9aa0a6; cursor: pointer; 
            width: 28px; height: 28px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; margin-bottom: 2px; margin-left: 8px;
            transition: background 0.15s, color 0.15s;
        }
        .add-tab-btn:hover { background: rgba(255, 255, 255, 0.08); color: #e8eaed; }
        .add-tab-btn i { font-size: 18px; }

        .nav-bar { display: flex; background: #202124; padding: 6px 12px; gap: 12px; align-items: center; border-bottom: 1px solid #3c4043; }
        .nav-buttons { display: flex; gap: 4px; color: #5f6368; }
        .nav-btn { background: none; border: none; color: #e8eaed; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.08); }
        
        .address-bar-wrapper { 
            flex: 1; display: flex; align-items: center; background: #2f3033; 
            border-radius: 30px; padding: 0 16px; height: 28px; gap: 8px;
            border: 2px solid transparent; transition: background 0.1s, border-color 0.1s;
        }
        .address-bar-wrapper:focus-within { background: #202124; border-color: #8ab4f8; }
        .address-bar-wrapper i { font-size: 16px; color: #9aa0a6; }
        .address-bar { width: 100%; border: none; background: transparent; color: #e8eaed; outline: none; font-size: 13px; }

        .viewport-container { flex: 1; position: relative; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; display: none; background: #fff; }
        iframe.active { display: block; }

        @keyframes tabSpawn {
            from { transform: scaleX(0.6) translateY(5px); opacity: 0; }
            to { transform: scaleX(1) translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="tab-bar" id="tabBar">
        <button class="add-tab-btn" onclick="createNewTab()">
            <i class="material-icons-round">add</i>
        </button>
    </div>

    <div class="nav-bar">
        <div class="nav-buttons">
            <button class="nav-btn" onclick="triggerAction('refresh')"><i class="material-icons-round">refresh</i></button>
        </div>
        <div class="address-bar-wrapper">
            <i class="material-icons-round">lock</i>
            <input type="text" class="address-bar" id="addressBar" placeholder="Search or type a URL" onkeydown="handleNavigation(event)">
        </div>
    </div>

    <div class="viewport-container" id="viewportContainer"></div>

    <script>
        const PROXY_BACKEND = "https://bonto.run"; 
        
        let tabCount = 0;
        let activeTabId = null;

        function createNewTab() {
            tabCount++;
            const tabId = `tab-${tabCount}`;

            const tab = document.createElement('div');
            tab.className = 'tab';
            tab.id = `nav-${tabId}`;
            tab.innerHTML = `
                <i class="material-icons-round" style="font-size: 14px; color: #9aa0a6;">public</i>
                <span>New Tab</span> 
                <div class="close-btn" onclick="closeTab(event, '${tabId}')">
                    <i class="material-icons-round">close</i>
                </div>
            `;
            tab.onclick = () => switchTab(tabId);
            
            const addBtn = document.querySelector('.add-tab-btn');
            document.getElementById('tabBar').insertBefore(tab, addBtn);

            const iframe = document.createElement('iframe');
            iframe.id = tabId;
            iframe.src = 'about:blank';
            document.getElementById('viewportContainer').appendChild(iframe);

            switchTab(tabId);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('iframe').forEach(i => i.classList.remove('active'));

            const targetTab = document.getElementById(`nav-${tabId}`);
            const targetIframe = document.getElementById(tabId);

            if (targetTab && targetIframe) {
                targetTab.classList.add('active');
                targetIframe.classList.add('active');
                activeTabId = tabId;
                
                const currentUrl = targetIframe.dataset.originalUrl || '';
                document.getElementById('addressBar').value = currentUrl;
            }
        }

        function closeTab(event, tabId) {
            event.stopPropagation();
            document.getElementById(`nav-${tabId}`).remove();
            document.getElementById(tabId).remove();

            if (activeTabId === tabId) {
                const remainingTabs = document.querySelectorAll('.tab');
                if (remainingTabs.length > 0) {
                    const nextTabId = remainingTabs[remainingTabs.length - 1].id.replace('nav-', '');
                    switchTab(nextTabId);
                }
            }
        }

        function handleNavigation(event) {
            if (event.key === 'Enter' && activeTabId) {
                let input = document.getElementById('addressBar').value.trim();
                if (!input) return;

                let destinationUrl = input;
                if (!destinationUrl.startsWith('http://') && !destinationUrl.startsWith('https://')) {
                    if (destinationUrl.includes('.') && !destinationUrl.includes(' ')) {
                        destinationUrl = 'https://' + destinationUrl;
                    } else {
                        destinationUrl = 'https://duckduckgo.com' + encodeURIComponent(input);
                    }
                }

                const iframe = document.getElementById(activeTabId);
                iframe.dataset.originalUrl = input;
                
                // Bulletproof direct string injection to replace all other variables
                const encodedUrl = btoa(destinationUrl); 
                iframe.src = "https://bonto.run" + encodedUrl;
                
                let displayTitle = input.replace('https://', '').replace('http://', '').replace('www.', '');
                document.getElementById(`nav-${activeTabId}`).querySelector('span').innerText = displayTitle;
            }
        }

        function triggerAction(action) {
            if (!activeTabId) return;
            const iframe = document.getElementById(activeTabId);
            if (action === 'refresh') iframe.src = iframe.src;
        }

        createNewTab();
    </script>
</body>
</html>
