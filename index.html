<script>
    // FIX 1: Direct link strictly to your working aloparatha subdomain
    const PROXY_BACKEND = "https://bonto.run"; 
    
    let tabCount = 0;
    let activeTabId = null;

    function createNewTab() {
        tabCount++;
        const tabId = `tab-${tabCount}`;

        const tab = document.createElement('div');
        tab.className = 'tab';
        tab.id = `nav-${tabId}`;
        tab.innerHTML = `
            <i class="material-icons-round" style="font-size: 14px; color: #9aa0a6;">public</i>
            <span>New Tab</span> 
            <div class="close-btn" onclick="closeTab(event, '${tabId}')">
                <i class="material-icons-round">close</i>
            </div>
        `;
        tab.onclick = () => switchTab(tabId);
        
        const addBtn = document.querySelector('.add-tab-btn');
        document.getElementById('tabBar').insertBefore(tab, addBtn);

        const iframe = document.createElement('iframe');
        iframe.id = tabId;
        iframe.src = 'about:blank';
        document.getElementById('viewportContainer').appendChild(iframe);

        switchTab(tabId);
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('iframe').forEach(i => i.classList.remove('active'));

        const targetTab = document.getElementById(`nav-${tabId}`);
        const targetIframe = document.getElementById(tabId);

        if (targetTab && targetIframe) {
            targetTab.classList.add('active');
            targetIframe.classList.add('active');
            activeTabId = tabId;
            
            const currentUrl = targetIframe.dataset.originalUrl || '';
            document.getElementById('addressBar').value = currentUrl;
        }
    }

    function closeTab(event, tabId) {
        event.stopPropagation();
        document.getElementById(`nav-${tabId}`).remove();
        document.getElementById(tabId).remove();

        if (activeTabId === tabId) {
            const remainingTabs = document.querySelectorAll('.tab');
            if (remainingTabs.length > 0) {
                const nextTabId = remainingTabs[remainingTabs.length - 1].id.replace('nav-', '');
                switchTab(nextTabId);
            }
        }
    }

    function handleNavigation(event) {
        if (event.key === 'Enter' && activeTabId) {
            let input = document.getElementById('addressBar').value.trim();
            if (!input) return;

            // FIX 2: Better URL parsing so raw keywords automatically convert to search engine targets
            if (!input.startsWith('http://') && !input.startsWith('https://')) {
                if (input.includes('.') && !input.includes(' ')) {
                    input = 'https://' + input;
                } else {
                    // Fallback to Google Search query if a keyword is typed
                    input = 'https://google.com' + encodeURIComponent(input);
                }
            }

            const iframe = document.getElementById(activeTabId);
            iframe.dataset.originalUrl = input;
            
            // Safe Base64 translation targeting our backend routing structure
            const encodedUrl = btoa(input); 
            iframe.src = `${PROXY_BACKEND}${encodedUrl}`;
            
            let displayTitle = input.replace('https://', '').replace('http://', '').replace('www.', '');
            document.getElementById(`nav-${activeTabId}`).querySelector('span').innerText = displayTitle;
        }
    }

    function triggerAction(action) {
        if (!activeTabId) return;
        const iframe = document.getElementById(activeTabId);
        if (action === 'refresh') iframe.src = iframe.src;
    }

    createNewTab();
</script>
