<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome Web Browser</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #202124; color: #e8eaed; overflow: hidden; }
        .tab-bar { display: flex; align-items: flex-end; background: #2f3033; padding: 8px 12px 0 12px; height: 40px; user-select: none; }
        .tab { 
            display: flex; align-items: center; background: transparent; padding: 0 20px; 
            height: 32px; min-width: 140px; max-width: 240px; flex: 1;
            border-radius: 8px 8px 0 0; cursor: pointer; transition: background 0.15s ease, color 0.15s ease; 
            position: relative; font-size: 12px; color: #9aa0a6; gap: 8px;
        }
        .tab:hover { background: rgba(255, 255, 255, 0.05); color: #e8eaed; }
        .tab.active { background: #202124; color: #e8eaed; font-weight: 500; }
        .tab.active::before, .tab.active::after { content: ''; position: absolute; bottom: 0; width: 8px; height: 8px; background: #202124; }
        .tab.active::before { left: -8px; border-bottom-right-radius: 8px; box-shadow: 4px 4px 0 4px #202124; }
        .tab.active::after { right: -8px; border-bottom-left-radius: 8px; box-shadow: -4px 4px 0 4px #202124; }
        .tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .tab .close-btn { display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; }
        .tab .close-btn:hover { background: rgba(255, 255, 255, 0.15); }
        .tab .close-btn i { font-size: 11px; }
        .add-tab-btn { background: none; border: none; color: #9aa0a6; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 2px; margin-left: 8px; }
        .add-tab-btn:hover { background: rgba(255, 255, 255, 0.08); color: #e8eaed; }
        .nav-bar { display: flex; background: #202124; padding: 6px 12px; gap: 12px; align-items: center; border-bottom: 1px solid #3c4043; }
        .nav-btn { background: none; border: none; color: #e8eaed; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.08); }
        .address-bar-wrapper { flex: 1; display: flex; align-items: center; background: #2f3033; border-radius: 30px; padding: 0 16px; height: 28px; gap: 8px; }
        .address-bar { width: 100%; border: none; background: transparent; color: #e8eaed; outline: none; font-size: 13px; }
        .viewport-container { flex: 1; position: relative; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; display: none; background: #fff; }
        iframe.active { display: block; }
    </style>
</head>
<body>

    <div class="tab-bar" id="tabBar">
        <button class="add-tab-btn" onclick="createNewTab()"><i class="material-icons-round">add</i></button>
    </div>

    <div class="nav-bar">
        <button class="nav-btn" onclick="triggerAction('refresh')"><i class="material-icons-round">refresh</i></button>
        <div class="address-bar-wrapper">
            <i class="material-icons-round">lock</i>
            <input type="text" class="address-bar" id="addressBar" placeholder="Type website URL here" onkeydown="handleNavigation(event)">
        </div>
    </div>

    <div class="viewport-container" id="viewportContainer"></div>

    <script>
        let tabCount = 0;
        let activeTabId = null;

        function createNewTab() {
            tabCount++;
            const tabId = `tab-${tabCount}`;

            const tab = document.createElement('div');
            tab.className = 'tab';
            tab.id = `nav-${tabId}`;
            tab.innerHTML = `
                <i class="material-icons-round" style="font-size: 14px; color: #9aa0a6;">public</i>
                <span>New Tab</span> 
                <div class="close-btn" onclick="closeTab(event, '${tabId}')"><i class="material-icons-round">close</i></div>
            `;
            tab.onclick = () => switchTab(tabId);
            
            const addBtn = document.querySelector('.add-tab-btn');
            document.getElementById('tabBar').insertBefore(tab, addBtn);

            const iframe = document.createElement('iframe');
            iframe.id = tabId;
            iframe.src = 'about:blank';
            document.getElementById('viewportContainer').appendChild(iframe);

            switchTab(tabId);
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('iframe').forEach(i => i.classList.remove('active'));

            const targetTab = document.getElementById(`nav-${tabId}`);
            const targetIframe = document.getElementById(tabId);

            if (targetTab && targetIframe) {
                targetTab.classList.add('active');
                targetIframe.classList.add('active');
                activeTabId = tabId;
                document.getElementById('addressBar').value = targetIframe.dataset.originalUrl || '';
            }
        }

        function closeTab(event, tabId) {
            event.stopPropagation();
            document.getElementById(`nav-${tabId}`).remove();
            document.getElementById(tabId).remove();
            if (activeTabId === tabId) {
                const remainingTabs = document.querySelectorAll('.tab');
                if (remainingTabs.length > 0) {
                    switchTab(remainingTabs[remainingTabs.length - 1].id.replace('nav-', ''));
                }
            }
        }

        function handleNavigation(event) {
            if (event.key === 'Enter' && activeTabId) {
                let input = document.getElementById('addressBar').value.trim();
                if (!input) return;

                let finalUrl = input;
                if (!finalUrl.startsWith('http://') && !finalUrl.startsWith('https://')) {
                    if (finalUrl.includes('.') && !finalUrl.includes(' ')) {
                        finalUrl = 'https://' + finalUrl;
                    } else {
                        finalUrl = 'https://duckduckgo.com' + encodeURIComponent(input);
                    }
                }

                const iframe = document.getElementById(activeTabId);
                iframe.dataset.originalUrl = input;
                
                // FORCE INJECTION: Strips completely any string concatenation bugs
                const scrambled = btoa(finalUrl);
                iframe.src = "https://bonto.run" + scrambled;
                
                document.getElementById(`nav-${activeTabId}`).querySelector('span').innerText = input;
            }
        }

        function triggerAction(action) {
            if (action === 'refresh' && activeTabId) document.getElementById(activeTabId).src = document.getElementById(activeTabId).src;
        }

        createNewTab();
    </script>
</body>
</html>
